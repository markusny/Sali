<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sali – treeniohjelma</title>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1c1a; --mute:#6b6a65; --line:#e4e2dc;
  --accent:#d9480f; --accent-soft:#fff1ea; --ok:#2b8a3e; --ok-soft:#ebfbee; --blue:#1c7ed6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141413; --card:#1f1f1d; --ink:#f1efe8; --mute:#a09e96; --line:#33322f;
    --accent:#ff8a4c; --accent-soft:#3a2418; --ok:#69db7c; --ok-soft:#1d3322; --blue:#74c0fc; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
.week{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.week button{border:none;background:transparent;color:var(--ink);font:inherit;font-size:18px;width:32px;height:30px;border-radius:999px}
.week span{font-weight:600;font-size:14px;min-width:78px;text-align:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;white-space:nowrap;padding:9px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;font-weight:600}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .25s}
.ptext{font-size:13px;color:var(--mute);margin-top:4px;min-height:18px}
.banner{margin-top:8px;background:var(--ok-soft);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.banner button{border:none;background:var(--ok);color:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
main{padding:12px 16px 120px;max-width:640px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px}
.round{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute);margin:-2px 0 8px}
.rbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px}
.rbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.done{background:var(--ok-soft);border-color:transparent}
.row{display:flex;align-items:flex-start;gap:10px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:#fff;font-size:16px;padding:0;margin-top:1px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.name{flex:1;font-weight:600}
.done .name>.t{text-decoration:line-through;color:var(--mute)}
.sub{font-size:13px;color:var(--mute);font-weight:400}
.icons{display:flex;gap:2px;flex:none}
.ib{border:none;background:transparent;color:var(--mute);font-size:18px;padding:2px 6px;border-radius:6px}
a.yt{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin-top:6px;font-weight:500}
.target{margin:10px 0 0 38px;font-size:14px;background:var(--bg);border-radius:8px;padding:7px 10px}
.target b{color:var(--accent)}
.params{display:flex;gap:8px;margin-top:8px;margin-left:38px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.f input{margin-top:2px;width:80px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.f.sm input{width:56px}
.sets-dots{display:flex;gap:6px;margin:10px 0 0 38px;flex-wrap:wrap}
.dot{min-width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.dot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.info{margin:10px 0 0 38px;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;display:none}
.info.open{display:block}
.info ul{margin:0;padding-left:18px}
.note{margin:8px 0 0 38px}
.note input{width:100%;padding:7px 8px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
.add{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--mute);font:inherit;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bar button{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tips{font-size:14px}
.tips p{margin:0 0 8px}
table.plan{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.plan th,table.plan td{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line)}
table.plan th{color:var(--mute);font-weight:500;font-size:12px}
table.plan tr.cur td{background:var(--accent-soft);font-weight:600}
table.plan tr.dl td{color:var(--mute);font-style:italic}
.pedit{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.delta{font-weight:600;color:var(--ok)}
.delta.neg{color:#e03131}
svg.chart{width:100%;height:90px;display:block;margin-top:8px}
.log{font-size:13px;color:var(--mute);margin-top:6px}
.hist .h{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.hist .h:last-child{border:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sheet .g{display:flex;gap:8px}.sheet .g>div{flex:1}
.sheet .cb{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)}
.sheet .cb input{width:auto}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.btns .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns .danger{color:#e03131}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--mute);margin-top:1px}
.sync.ok{color:var(--ok)}
.sync.bad{color:#e03131}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Sali</h1><div class="sync" id="sync"></div></div>
    <div class="week"><button id="wPrev" aria-label="Edellinen viikko">‹</button><span id="wLbl"></span><button id="wNext" aria-label="Seuraava viikko">›</button></div>
  </div>
  <div class="tabs">
    <button class="tab" data-t="t1">Treeni 1</button>
    <button class="tab" data-t="t2">Treeni 2</button>
    <button class="tab" data-t="plan">Viikot</button>
    <button class="tab" data-t="prog">Edistys</button>
    <button class="tab" data-t="info">Ohjeet</button>
  </div>
  <div class="progress" id="pwrap"><div id="pbar"></div></div>
  <div class="ptext" id="ptext"></div>
  <div id="banner"></div>
</header>
<main id="main"></main>
<div class="bar" id="bar">
  <button id="resetBtn">Tyhjennä</button>
  <button class="primary" id="finishBtn">Treeni valmis ✓</button>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const WEEKS = 8;
const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q).replace(/%20/g,"+");
let uid = 0; const id = () => "x" + Date.now().toString(36) + (uid++);

/* Liikkeen kentät:
   s sarjat, rmin/rmax toistohaarukka, side = toistot per puoli (8+8), unit = toistojen yksikkö (esim. "m"),
   kg aloituspaino, pair = paino per käsi (2x), inc = nousu per vaihe (negatiivinen = avustus vähenee), kl = painon nimi */
const W = (n,q,tips) => ({n,q,tips});
const M = (n,o,q,tips) => Object.assign({id:"", n, s:3, rmin:8, rmax:10, side:false, unit:"", kg:0, pair:false, inc:0, kl:"Kg", note:"", q, tips}, o);

const DEFAULT = {
  t1: { title:"Treeni 1",
    warmup:[ W("Soutu 5min","rowing machine technique",["Järjestys: jalat – selkä – kädet, palatessa toisin päin","Rauhallinen veto, kevyt hengästys riittää"]) ],
    circuit:[
      W("Y-T-W vatsamakuulla 5 kpl kutakin","prone YTW exercise",["Peukalot ylöspäin, lavat taakse ja alas","Pieni liike, ei niskaa ylös"]),
      W("Kylkilankku 20s+20s","side plank technique",["Kyynärpää olkapään alla","Lantio ylhäällä, keho suorassa linjassa"]),
      W("Lantion nosto 2 jalalla, pito 3s x10","glute bridge hold technique",["Paina kantapäillä","Purista pakarat yläasennossa, älä notkista selkää"]),
      W("Lonkkien avaus 90/90 5+5","90 90 hip switch",["Selkä pitkänä","Käytä käsiä tukena tarvittaessa"]),
      W("Kissa-kameli 8","cat camel exercise",["Hidas liike nikama kerrallaan","Hengitä liikkeen tahdissa"]),
    ],
    main:[
      M("Askellus korokkeelle käsipainoilla",{rmin:8,rmax:10,side:true,kg:14,pair:true,inc:2},"dumbbell step up technique",["Koroke n. polven korkeudella","Työnnä ylös etujalan kantapäällä, takajalka ei ponnista"]),
      M("Takareisikoukistus laitteessa",{rmin:10,rmax:12,kg:35,inc:2.5},"seated leg curl machine technique",["Polvi laitteen akselin kohdalla","Hidas paluu, 2–3 s"]),
      M("Penkkipunnerrus tangolla",{s:4,rmin:6,rmax:8,kg:60,inc:2.5,note:"1.30min tauko"},"barbell bench press technique",["Lavat taakse ja alas, jalat tukevasti lattiassa","Tanko rintalastan alaosaan, kyynärpäät n. 45°"]),
      M("Kulmasoutu 1 kädellä penkkiä vasten",{rmin:8,rmax:10,side:true,kg:26,inc:2},"one arm dumbbell row technique",["Selkä suorana, vedä paino lonkkaa kohti","Ei vartalon kiertoa"]),
      M("Pallof press taljassa",{s:2,rmin:10,rmax:12,side:true,kg:15,inc:2.5},"pallof press cable technique",["Seiso sivuttain taljaan nähden","Vastusta kiertoa, kädet suoraksi eteen"]),
      M("Farmarikävely kahvakuulilla",{rmin:30,rmax:30,unit:"m",kg:24,pair:true,inc:4},"farmers walk technique",["Ryhti pystyssä, hartiat alhaalla","Lyhyet, rauhalliset askeleet"]),
    ]},
  t2: { title:"Treeni 2",
    warmup:[ W("Pyörä 7min","exercise bike setup",["Satulan korkeus: polvi lähes suora ala-asennossa","Kevyt-keskiraskas vastus"]) ],
    circuit:[
      W("Hollow hold 20s","hollow body hold technique",["Alaselkä painettuna lattiaan","Helpota koukistamalla polvet"]),
      W("Lankku olkapää-taputuksella 10+10","plank shoulder taps technique",["Jalat leveämmälle = helpompi","Lantio ei saa heilua"]),
      W("Lantion nosto 1 jalalla, jalka korokkeella 8+8","single leg elevated glute bridge",["Kantapää korokkeella","Lantio pysyy vaakatasossa"]),
      W("Lonkkien avaus","hip opener mobility routine",["Rauhallisesti, ei pakottamista"]),
      W("Rintarangan kierto kylkimakuulla 8+8","side lying thoracic rotation",["Polvet koukussa, alempi käsi pitää polvia","Seuraa kättä katseella"]),
    ],
    main:[
      M("Lantionnosto tangolla (hip thrust)",{rmin:8,rmax:10,kg:60,inc:5},"barbell hip thrust technique",["Lapaluiden alaosa penkkiä vasten, tankopehmuste","Leuka kohti rintaa, pakarat kiinni yläasennossa"]),
      M("Jalkaprässi 1 jalalla",{rmin:10,rmax:12,side:true,kg:60,inc:5},"single leg leg press technique",["Jalka keskellä levyä","Polvi linjassa varpaiden kanssa, alaselkä kiinni selkänojassa"]),
      M("Leuanveto avustettuna",{s:4,rmin:5,rmax:8,kg:30,inc:-5,kl:"Avustus kg"},"assisted pull up machine technique",["Aloita lavat alas vetämällä","Rinta kohti tankoa, hallittu lasku","Avustus vähenee = kehitys"]),
      M("Landmine-punnerrus seisten",{rmin:8,rmax:10,side:true,kg:15,inc:2.5,kl:"Levyt kg"},"standing single arm landmine press",["Vatsa tiukkana, ei taaksekallistusta","Työnnä ylös ja hieman eteen"]),
      M("Kaapelisoutu istuen kapealla otteella",{rmin:10,rmax:12,kg:50,inc:5},"seated cable row close grip technique",["Rinta ylhäällä, vedä kahvat napaan","Ylävartalo ei keinu"]),
      M("Puunhakkuu taljassa ylhäältä alas",{s:2,rmin:10,rmax:12,side:true,kg:15,inc:2.5},"cable woodchop high to low",["Kierto tulee ylävartalosta ja lantiosta yhdessä","Kädet pysyvät melko suorina"]),
      M("Ab wheel polviltaan",{s:2,rmin:6,rmax:12},"kneeling ab wheel rollout technique",["Pakarat ja vatsa tiukkana, ei notkoa","Mene vain niin pitkälle kuin hallitset"]),
    ]}
};
function freshProg(){
  const p = JSON.parse(JSON.stringify(DEFAULT));
  ["t1","t2"].forEach(t=>p[t].main.forEach((ex,i)=>ex.id=t+"_"+i));
  return p;
}

/* ---------- 8 viikon nousujohteisuus ----------
   Vk 1–3: aloituspaino, toistot nousevat alarajalta ylärajalle
   Vk 4–6: +1 nousu, toistot taas alarajalta ylös
   Vk 7:   +2 nousua, toistojen alaraja (testiviikko)
   Vk 8:   kevennys: vk 4 paino, 1 sarja vähemmän, alaraja      */
const r05 = x => Math.round(x*2)/2;
function plan(ex, w){
  const hasKg = (+ex.kg||0) !== 0 || (+ex.inc||0) !== 0;
  const span = (+ex.rmax||0) - (+ex.rmin||0);
  let stage, step, sets = +ex.s||1, deload = false;
  if (w<=3){ stage=0; step=w-1; } else if (w<=6){ stage=1; step=w-4; } else if (w===7){ stage=2; step=0; } else { stage=1; step=0; deload=true; sets=Math.max(1,sets-1); }
  let reps, kg = null;
  if (hasKg){
    reps = (+ex.rmin) + Math.round(step*span/2);
    kg = Math.max(0, r05((+ex.kg) + (+ex.inc)*stage));
  } else {
    reps = deload ? +ex.rmin : Math.min(+ex.rmax, (+ex.rmin) + (w-1));
  }
  return {sets, reps, kg, deload};
}
const repStr = (ex, r) => ex.side ? `${r}+${r}` : `${r}${ex.unit||""}`;
const kgStr = (ex, kg) => kg==null ? "" : (ex.pair ? `2×${kg}` : `${kg}`) + " kg";
function planStr(ex, w){ const p = plan(ex,w); return `${p.sets}×${repStr(ex,p.reps)}${p.kg!=null?" @ "+kgStr(ex,p.kg):""}`; }

/* ---------- tila ---------- */
const KEY = "sali-v2";
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return null; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function save(){ state.updatedAt = Date.now(); saveLocal(); queueStateWrite(); }
let state = load() || {
  tab:"t1", week:1, block:1,
  prog: freshProg(),
  done:{t1:{},t2:{}}, rounds:{t1:[false,false],t2:[false,false]},
  cur:{t1:{},t2:{}},          // tämän treenin toteutuneet kg/toistot liikkeittäin
  weekDone:{t1:false,t2:false},
  logs:[]                     // {date, ts, week, block, t, id, n, kg, reps, sets, side, pair, unit}
};
if(!state.finished) state.finished={t1:null,t2:null};
let openInfo = {};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }

function actual(t, ex){
  const c = state.cur[t][ex.id] || {}; const p = plan(ex, state.week);
  return { kg: c.kg ?? (p.kg ?? ""), reps: c.reps ?? p.reps };
}
function setsArr(t,k){ return Array.isArray(state.done[t][k]) ? state.done[t][k] : []; }
function isDone(t,key,ex){
  const d = state.done[t][key];
  if (ex){ const n = plan(ex,state.week).sets; const a = setsArr(t,key); return a.length>=n && a.slice(0,n).every(Boolean); }
  return d===true;
}
function counts(t){
  const p=state.prog[t]; let total=0, done=0;
  [["w",p.warmup],["c",p.circuit]].forEach(([k,a])=>a.forEach((x,i)=>{total++; if(isDone(t,k+i)) done++;}));
  p.main.forEach(ex=>{total++; if(isDone(t,ex.id,ex)) done++;});
  return {total,done};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.t===state.tab));
  $("#wLbl").textContent = `Viikko ${state.week}/${WEEKS}`;
  const t = state.tab, workout = t==="t1"||t==="t2";
  $("#bar").style.display = workout ? "flex" : "none";
  $("#pwrap").style.display = workout ? "block" : "none";
  // banneri
  let b = "";
  if (state.weekDone.t1 && state.weekDone.t2){
    b = state.week < WEEKS
      ? `<div class="banner">Viikko ${state.week} tehty 💪<button id="nextWeek">Viikolle ${state.week+1} →</button></div>`
      : `<div class="banner">Jakso valmis! 🎉<button id="newBlock">Uusi jakso, painot ylös</button></div>`;
  }
  $("#banner").innerHTML = b;
  if (t==="plan") return renderPlan();
  if (t==="prog") return renderProg();
  if (t==="info") return renderInfo();
  const {total,done} = counts(t);
  $("#pbar").style.width = (total?done/total*100:0)+"%";
  const dl = state.week===WEEKS ? " · kevennysviikko" : state.week===7 ? " · raskas viikko" : "";
  $("#ptext").textContent = `${done}/${total} liikettä tehty${dl}${state.weekDone[t]?" · tehty jo tällä viikolla":""}`;
  const p = state.prog[t], fin = state.finished[t];
  $("#finishBtn").textContent = fin ? "Päivitä tallennus" : "Treeni valmis ✓";
  $("#resetBtn").textContent = fin ? "Aloita uusi kerta" : "Tyhjennä";
  let h = fin ? `<div class="card done" style="margin-top:4px"><div class="row" style="align-items:center"><div class="name">✓ Treeni tallennettu ${esc(fin.date)}<br><span class="sub">Merkinnät pysyvät näkyvissä. Muutokset saa talteen "Päivitä tallennus" -napilla.</span></div><button class="rbtn" id="undoFinish">Peru</button></div></div>` : "";
  h += `<h2>Lämmittely</h2>`;
  p.warmup.forEach((x,i)=>h+=simpleCard(t,"w"+i,x));
  h += `<h2>Lämmittelykierto</h2><div class="round">Kierrokset:
     ${state.rounds[t].map((on,i)=>`<button class="rbtn ${on?"on":""}" data-round="${i}">${i+1}. kierros${on?" ✓":""}</button>`).join("")}</div>`;
  p.circuit.forEach((x,i)=>h+=simpleCard(t,"c"+i,x));
  h += `<h2>Työsarjat · viikko ${state.week}</h2>`;
  p.main.forEach((ex,i)=>h+=mainCard(t,i,ex));
  h += `<button class="add" id="addEx">+ Lisää liike</button>`;
  $("#main").innerHTML = h;
}
const infoBlock = (key,x) => x.tips&&x.tips.length ? `<div class="info ${openInfo[key]?"open":""}"><ul>${x.tips.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>` : "";

function lastLog(id){ for(let i=state.logs.length-1;i>=0;i--) if(state.logs[i].id===id) return state.logs[i]; return null; }
function chart(points, unit){
  if(points.length<2) return `<div class="log">Kaavio näkyy, kun liikkeestä on vähintään 2 kirjausta.</div>`;
  const W=300,H=90,P=8; const ys=points.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;}
  const xy = points.map((p,i)=>[P+i*(W-2*P)/(points.length-1), H-P-(p.y-mn)/(mx-mn)*(H-2*P-12)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${xy.map(a=>a.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--accent)"/>`).join("")}
    <text x="${P}" y="11" font-size="10" fill="var(--mute)">${mx}${unit}</text>
    <text x="${W-P}" y="${H-1}" font-size="10" fill="var(--mute)" text-anchor="end">${points[points.length-1].d}</text>
  </svg>`;
}
function renderProg(){
  $("#ptext").textContent = "";
  const sessions = new Set(state.logs.map(l=>l.ts)).size;
  const now = Date.now(), wk = new Set(state.logs.filter(l=>now-l.ts<7*864e5).map(l=>l.ts)).size;
  let h = `<div class="stats">
    <div class="stat"><b>${sessions}</b><span>treeniä yhteensä</span></div>
    <div class="stat"><b>${wk}</b><span>viim. 7 pv</span></div>
    <div class="stat"><b>${state.block}.${state.week}</b><span>jakso.viikko</span></div></div>`;
  ["t1","t2"].forEach(t=>{
    h += `<h2>${state.prog[t].title}</h2>`;
    state.prog[t].main.forEach(ex=>{
      const L = state.logs.filter(l=>l.id===ex.id);
      const useKg = L.some(l=>l.kg!==""&&l.kg!=null&&!isNaN(+l.kg));
      const pts = L.map(l=>({y: useKg?+l.kg:+l.reps, d:l.date}));
      let delta="";
      if(L.length>=2){
        const a=pts[0].y, b=pts[pts.length-1].y; let diff=r05(b-a);
        const good = ex.inc<0 ? diff<=0 : diff>=0;
        const u = useKg?" kg":" toistoa";
        delta = `<span class="delta ${good?"":"neg"}">${diff>0?"+":""}${diff}${u}</span> <span class="sub">ensimmäisestä kirjauksesta${ex.inc<0?" (avustus: pienempi on parempi)":""}</span>`;
      }
      const best = L.length ? (ex.inc<0 ? Math.min(...pts.map(p=>p.y)) : Math.max(...pts.map(p=>p.y))) : null;
      h += `<div class="card"><div class="name">${esc(ex.n)}</div>
        <div class="log">${L.length?`Paras: <b>${best}${useKg?" kg":""}</b> · ${L.length} kirjausta`:"Ei vielä kirjauksia"} ${delta?"<br>"+delta:""}</div>
        ${L.length?chart(pts.slice(-20), useKg?"kg":""):""}
        ${L.length?`<div class="log">${L.slice(-4).reverse().map(l=>`${esc(l.date)} (vk ${l.week}): ${l.sets}×${repStr(ex,l.reps)}${l.kg!==""&&l.kg!=null?" @ "+kgStr(ex,l.kg):""}`).join("<br>")}</div>`:""}
      </div>`;
    });
  });
  const sess = groupLogs(state.logs).sort((a,b)=>b.ts-a.ts);
  h += `<h2>Treenihistoria</h2>`;
  h += sess.length ? `<div class="card hist">${sess.map(s0=>{ const e=s0.entries[0]; const title=(state.prog[e.t]&&state.prog[e.t].title)||e.t;
      const tm=new Date(s0.ts); const hh=String(tm.getHours()).padStart(2,"0")+":"+String(tm.getMinutes()).padStart(2,"0");
      return `<div class="h row" style="align-items:center"><div class="name">${esc(e.date)} klo ${hh} · ${esc(title)}<br><span class="sub">Viikko ${e.week} · ${s0.entries.length} liikettä</span></div><button class="rbtn" data-delsess="${s0.ts}" style="color:#e03131">Poista</button></div>`; }).join("")}</div>`
    : `<div class="card"><span class="sub">Ei tallennettuja treenejä.</span></div>`;
  $("#main").innerHTML = h;
}

      <div><label>Toistot max</label><input id="e_rmax" inputmode="numeric" value="${esc(ex.rmax)}"></div></div>
    <div class="g"><div><label>Aloituspaino kg</label><input id="e_kg" inputmode="decimal" value="${esc(ex.kg)}"></div>
      <div><label>Nousu / vaihe kg</label><input id="e_inc" inputmode="decimal" value="${esc(ex.inc)}"></div></div>
    <label class="cb"><input type="checkbox" id="e_side" ${ex.side?"checked":""}> Toistot per puoli (8+8)</label>

    <label>Tekniikkavinkit (yksi per rivi)</label><textarea id="e_t" rows="3">${esc((ex.tips||[]).join("\n"))}</textarea>
    <p class="sub">Painoton liike: jätä paino ja nousu nollaksi, jolloin toistot nousevat viikoittain. Avustettu liike: negatiivinen nousu.</p>
    <div class="btns">${isNew?"":`<button class="danger" id="e_del">Poista</button>`}<button id="e_cancel">Peruuta</button><button class="primary" id="e_ok">Tallenna</button></div>`;
  $("#modal").classList.add("open");
  $("#e_cancel").onclick = closeModal;
  if(!isNew) $("#e_del").onclick = ()=>{ state.prog[t].main.splice(i,1); save(); closeModal(); render(); toast("Liike poistettu"); };
  $("#e_ok").onclick = ()=>{
    const num = (v,d)=>{ const x=parseFloat(String(v).replace(",",".")); return isNaN(x)?d:x; };
    Object.assign(ex, { n:$("#e_n").value.trim()||"Uusi liike", s:Math.max(1,Math.min(10,num($("#e_s").value,3)|0)),
      rmin:num($("#e_rmin").value,8), rmax:Math.max(num($("#e_rmin").value,8), num($("#e_rmax").value,10)),
      kg:num($("#e_kg").value,0), inc:num($("#e_inc").value,0), side:$("#e_side").checked, pair:$("#e_pair").checked,
      q:$("#e_q").value.trim()||$("#e_n").value.trim(), tips:$("#e_t").value.split("\n").map(x=>x.trim()).filter(Boolean) });
    if(isNew) state.prog[t].main.push(ex);
    delete state.cur[t][ex.id];
    save(); closeModal(); render();
  };
}
function closeModal(){ $("#modal").classList.remove("open"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
function findEx(idv){ for(const t of ["t1","t2"]) for(const ex of state.prog[t].main) if(ex.id===idv) return ex; }
function setWeek(w){ state.week=Math.max(1,Math.min(WEEKS,w)); state.weekDone={t1:false,t2:false}; state.cur={t1:{},t2:{}}; state.done={t1:{},t2:{}}; state.rounds={t1:[false,false],t2:[false,false]}; state.finished={t1:null,t2:null}; save(); render(); }

/* ---------- tapahtumat ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; const t=state.tab;
  if (b.dataset.t){ state.tab=b.dataset.t; save(); render(); window.scrollTo(0,0); return; }
  if (b.id==="wPrev"){ setWeek(state.week-1); return; }
  if (b.id==="wNext"){ setWeek(state.week+1); return; }
  if (b.id==="nextWeek"){ setWeek(state.week+1); toast(`Viikko ${state.week} alkaa`); return; }
  if (b.id==="newBlock"){
    ["t1","t2"].forEach(tt=>state.prog[tt].main.forEach(ex=>{ ex.kg = Math.max(0, r05((+ex.kg)+(+ex.inc))); }));
    state.block++; setWeek(1); toast(`Jakso ${state.block} alkaa, painot nostettu`); return;
  }
  if (b.dataset.toggle){ const k=b.dataset.toggle; state.done[t][k]=!state.done[t][k]; save(); render(); return; }
  if (b.dataset.round){ const r=+b.dataset.round; state.rounds[t][r]=!state.rounds[t][r]; save(); render(); return; }
  if (b.dataset.info){ openInfo[b.dataset.info]=!openInfo[b.dataset.info]; render(); return; }
  if (b.dataset.edit){ openEdit(+b.dataset.edit); return; }
  if (b.dataset.set){ const [k,s]=b.dataset.set.split(":"); const a=setsArr(t,k).slice(); a[+s]=!a[+s]; state.done[t][k]=a; save(); render(); return; }
  if (b.dataset.allsets){ const ex=state.prog[t].main[+b.dataset.allsets]; const n=plan(ex,state.week).sets;
    state.done[t][ex.id] = isDone(t,ex.id,ex) ? [] : Array(n).fill(true); save(); render(); return; }
  if (b.id==="addEx"){ openEdit(null); return; }
  if (b.id==="resetBtn"){ const wasDone=!!state.finished[t]; state.done[t]={}; state.rounds[t]=[false,false]; state.cur[t]={}; state.finished[t]=null; save(); render(); window.scrollTo(0,0); toast(wasDone?"Uusi treenikerta aloitettu":"Merkinnät tyhjennetty"); return; }
  if (b.dataset.delsess){
    const ts=+b.dataset.delsess; const L=state.logs.filter(l=>l.ts===ts); if(!L.length) return;
    $("#sheet").innerHTML = `<h3>Poista treeni?</h3><p>${esc(L[0].date)} · ${esc((state.prog[L[0].t]||{}).title||"")} · ${L.length} liikettä</p><p class="sub">Kirjaukset poistuvat edistyksestä pysyvästi.</p>
      <div class="btns"><button id="e_cancel">Peruuta</button><button class="primary" id="delOk" style="background:#e03131;border-color:#e03131">Poista</button></div>`;
    $("#modal").classList.add("open"); $("#e_cancel").onclick=closeModal;
    $("#delOk").onclick=()=>{ const tt=L[0].t; state.logs=state.logs.filter(l=>l.ts!==ts);
      if(state.finished[tt] && state.finished[tt].ts===ts){ state.finished[tt]=null; state.weekDone[tt]=false; }
      save(); closeModal(); render(); toast("Treeni poistettu"); };
    return;
  }
  if (b.id==="undoFinish"){
    const f=state.finished[t]; if(!f) return;
    state.logs=state.logs.filter(l=>!(l.ts===f.ts && l.t===t));
    state.finished[t]=null; state.weekDone[t]=false;
    save(); render(); toast("Tallennus peruttu – merkinnät säilyivät"); return;
  }
  if (b.id==="finishBtn"){
    const prev=state.finished[t];
    const d=new Date(), ts=prev?prev.ts:d.getTime(), date=prev?prev.date:`${d.getDate()}.${d.getMonth()+1}.`;
    const newLogs=[]; let n=0;
    state.prog[t].main.forEach(ex=>{
      const sets = setsArr(t,ex.id).filter(Boolean).length; if(!sets) return;
      const a=actual(t,ex); n++;
      newLogs.push({date, ts, week:state.week, block:state.block, t, id:ex.id, n:ex.n, kg:a.kg===""?"":+String(a.kg).replace(",","."), reps:+a.reps||0, sets});
    });
    if(!n){ toast("Merkitse ensin tehdyt sarjat"); return; }
    state.logs=state.logs.filter(l=>!(l.ts===ts && l.t===t)).concat(newLogs);
    state.weekDone[t]=true; state.finished[t]={ts,date};
    save(); render(); window.scrollTo(0,0); toast(prev?"Tallennus päivitetty":`Tallennettu: ${n} liikettä 💪`);
    uploadSessions(groupLogs(state.logs.filter(l=>l.ts===ts)));
    return;
  }
  if (b.id==="restore"){ const keep=state.logs; state.prog=freshProg(); state.logs=keep; state.done={t1:{},t2:{}}; state.cur={t1:{},t2:{}}; save(); render(); toast("Alkuperäinen ohjelma palautettu"); return; }
  if (b.id==="exportBtn"){
    const txt = JSON.stringify(state);
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Varmuuskopio kopioitu"),()=>showText(txt)); }catch(err){ showText(txt); }
    return;
  }
  if (b.id==="importBtn"){
    $("#sheet").innerHTML = `<h3>Palauta varmuuskopio</h3><label>Liitä varmuuskopion teksti</label><textarea id="imp" rows="6"></textarea>
      <div class="btns"><button id="e_cancel">Peruuta</button><button class="primary" id="impOk">Palauta</button></div>`;
    $("#modal").classList.add("open"); $("#e_cancel").onclick=closeModal;
    $("#impOk").onclick=()=>{ try{ const s=JSON.parse($("#imp").value); if(!s.prog||!s.logs) throw 0; state=s; save(); closeModal(); render(); toast("Palautettu"); uploadSessions(groupLogs(state.logs)); }catch(err){ toast("Teksti ei kelpaa"); } };
    return;
  }
});
function showText(txt){
  $("#sheet").innerHTML = `<h3>Varmuuskopio</h3><p class="sub">Kopioi teksti talteen.</p><textarea rows="8" readonly>${esc(txt)}</textarea><div class="btns"><button id="e_cancel">Sulje</button></div>`;
  $("#modal").classList.add("open"); $("#e_cancel").onclick=closeModal;
}
document.addEventListener("input", e=>{

  if (el.dataset.cur){ const c = state.cur[t][el.dataset.id] = state.cur[t][el.dataset.id] || {}; c[el.dataset.cur]=el.value; save(); return; }

  return JSON.parse(JSON.stringify({v:2, week, block, prog, done, rounds, cur, weekDone, updatedAt: updatedAt||Date.now()}));
}
function adopt(rs){
  ["week","block","prog","done","rounds","cur","weekDone","updatedAt"].forEach(k=>{ if(rs[k]!==undefined) state[k]=JSON.parse(JSON.stringify(rs[k])); });
}
function groupLogs(logs){
  const m=new Map(); logs.forEach(l=>{ if(!m.has(l.ts)) m.set(l.ts,[]); m.get(l.ts).push(l); });
  return [...m.entries()].map(([ts,entries])=>({ts,entries}));
}
function mergeLogs(remoteSessions){
  const seen=new Set(), out=[];
  const add=l=>{ const k=l.ts+"|"+l.id; if(!seen.has(k)){ seen.add(k); out.push(l); } };
  remoteSessions.forEach(s=>(s.entries||[]).forEach(add));
  state.logs.forEach(add);
  out.sort((a,b)=>a.ts-b.ts);
  state.logs=out;
}
function queueStateWrite(){
  if(!cloud.col || !cloud.ready) return;
  setStatus("saving"); clearTimeout(cloud.timer); cloud.timer=setTimeout(flushState,700);
}
async function flushState(){
  if(!cloud.col) return;
  if(cloud.writing){ cloud.pending=true; return; }
  cloud.writing=true;
  try{ await writeRetry(cloud.col.doc("state"), stateBody()); setStatus("saved"); }
  catch(e){ setStatus(e&&e.code==="unavailable"?"offline":"error"); }
  cloud.writing=false;
  if(cloud.pending){ cloud.pending=false; flushState(); }
}
async function writeRetry(ref, body){
  try{ await ref.set(body); }
  catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,500+Math.random()*1000)); await ref.set(body); } else throw e; }
}
let uploading=Promise.resolve();
function uploadSessions(sessions){
  if(!cloud.col || !cloud.ready || !sessions.length) return;
  uploading = uploading.then(async()=>{
    setStatus("saving");
    try{
      for(const s of sessions) await writeRetry(cloud.col.doc("log_"+s.ts), JSON.parse(JSON.stringify({ts:s.ts, entries:s.entries})));
      setStatus("saved");
    }catch(e){ setStatus(e&&e.code==="quota_exceeded"?"error":(e&&e.code==="unavailable"?"offline":"error")); }
  });
}
function handleSnap(snap, first){
  let rs=null; const remote=[];
  snap.docs.forEach(d=>{ const x=d.data(); if(!x) return; if(d.id==="state") rs=x; else if(d.id.startsWith("log_")) remote.push(x); });
  if(first){
    cloud.ready=true;
    const localNewer = !rs || (state.updatedAt||0) > (rs.updatedAt||0);
    if(rs && !localNewer) adopt(rs);
    const remoteTs=new Set(remote.map(s=>s.ts));
    const missing=groupLogs(state.logs).filter(s=>!remoteTs.has(s.ts));
    mergeLogs(remote);
    saveLocal();
    if(localNewer){ setStatus("saving"); flushState(); } else setStatus("saved");
    uploadSessions(missing);
    renderSafe();
  } else {
    if(rs && !snap.metadata.hasPendingWrites && (rs.updatedAt||0) > (state.updatedAt||0)) adopt(rs);
    mergeLogs(remote); saveLocal(); renderSafe();
  }
}
async function initCloud(){
  const c = window.claude;
  if(!c || typeof c.use!=="function"){ setStatus("local"); return; }
  setStatus("loading");
  try{
    const [db,user] = await Promise.all([c.use("db"), c.use("user")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setStatus("local"); return; }
    cloud.col = db.collection("data/users/"+uid);
    let first=true;
    const timer=setTimeout(()=>{ if(!cloud.ready) setStatus("offline"); },10000);
    cloud.col.onSnapshot(snap=>{
      if(first && snap.metadata.fromCache) return;
      clearTimeout(timer);
      handleSnap(snap, first); first=false;
    }, err=>{ clearTimeout(timer); cloud.ready=false; setStatus(err&&err.code==="unavailable"?"offline":"error"); });
  }catch(e){ setStatus("local"); }
}

setStatus("local");
render();
initCloud();
</script>
